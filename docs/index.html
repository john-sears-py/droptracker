<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card Drops</title>
<style>
  :root {
    --bg: #f6f5f2; --surface: #ffffff; --text: #1d1c1a; --muted: #6b6862; --line: #e4e1db;
    --accent: #c2410c; --accent-soft: #fdebe1; --ok: #15803d; --chip: #efece6;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151413; --surface: #1e1d1b; --text: #eeebe5; --muted: #a29e96; --line: #33312d;
            --accent: #fb923c; --accent-soft: #3a2518; --ok: #4ade80; --chip: #2a2825; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .meta { color: var(--muted); font-size: 13px; margin: 6px 0 16px; }
  nav a { color: var(--muted); text-decoration: none; font-size: 14px; margin-right: 12px; }
  nav a[aria-current="page"] { color: var(--text); font-weight: 600; border-bottom: 2px solid var(--accent); }
  .buy { display: inline-block; margin-top: 6px; font-size: 13px; font-weight: 600; text-decoration: none; padding: 4px 11px; border-radius: 8px; background: var(--text); color: var(--bg); }
  .meta a { color: var(--accent); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; }
  .chip { border: 1px solid var(--line); background: var(--surface); color: var(--text);
          padding: 5px 12px; border-radius: 999px; font-size: 13px; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
       margin: 28px 0 8px; }
  .row { display: grid; grid-template-columns: 92px 1fr; gap: 12px; padding: 12px 14px;
         background: var(--surface); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px; }
  .when { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--muted); }
  .when b { display: block; color: var(--text); font-size: 15px; }
  .title { font-weight: 600; overflow-wrap: anywhere; }
  .title a { color: inherit; text-decoration: none; }
  .title a:hover { text-decoration: underline; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 2px; overflow-wrap: anywhere; }
  .tag { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 4px; margin-right: 6px;
         background: var(--chip); color: var(--muted); vertical-align: 1px; }
  .tag.hot { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .soon { border-color: var(--accent); }
  .empty, .err { color: var(--muted); font-size: 14px; padding: 8px 2px; }
  .err { color: var(--accent); }
  @media (max-width: 480px) { .row { grid-template-columns: 1fr; gap: 4px; } }
</style>
</head>
<body>
<main>
  <header style="display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px">
    <h1>Card Drops</h1>
    <nav><a href="./" aria-current="page">List</a><a href="calendar.html">Calendar</a></nav>
  </header>
  <div class="meta" id="meta">Loading…</div>
  <div class="chips" id="chips"></div>
  <div id="list"></div>
</main>
<script>
const TZ = "America/Chicago";
let data = null, filter = "All";

function when(d) {
  if (d.start) {
    const t = new Date(d.start);
    return { t, top: t.toLocaleDateString("en-US", { timeZone: TZ, weekday: "short", month: "short", day: "numeric" }),
             sub: t.toLocaleTimeString("en-US", { timeZone: TZ, hour: "numeric", minute: "2-digit" }) };
  }
  if (d.day) {
    const t = new Date(d.day + "T12:00:00");
    return { t, top: t.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" }), sub: "all day" };
  }
  return { t: null, top: "TBD", sub: "" };
}

function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

function row(d, now) {
  const w = when(d);
  const soon = w.t && d.start && (w.t - now) < 36e5 * 24 && w.t > now;
  const hot = d.premium || d.kind === "preorder" || d.kind === "drop" || d.kind === "lottery";
  return `<div class="row${soon ? " soon" : ""}">
    <div class="when"><b>${esc(w.top)}</b>${esc(w.sub)}</div>
    <div>
      <div class="title"><span class="tag${hot ? " hot" : ""}">${esc(d.kind)}</span><span class="tag">${esc(d.game)}</span>
        ${d.url ? `<a href="${esc(d.url)}" target="_blank" rel="noopener">${esc(d.title)}</a>` : esc(d.title)}</div>
      <div class="sub">${[d.price, d.note, d.source].filter(Boolean).map(esc).join(" · ")}</div>
      ${(d.buy_url || d.url) ? `<a class="buy" href="${esc(d.buy_url || d.url)}" target="_blank" rel="noopener">${esc(({lottery:"Enter lottery",preorder:"Pre-order",drop:"Open drop",release:"View",news:"Read"})[d.kind] || "Open")}</a>` : ""}
    </div></div>`;
}

function render() {
  const now = new Date();
  const drops = data.drops.filter(d => filter === "All" || d.game === filter);
  const lotteries = [], upcoming = [], openPre = [], recent = [];
  for (const d of drops) {
    const w = when(d);
    const today = new Date(now.toDateString());
    if (d.kind === "lottery") lotteries.push(d);
    else if (w.t && w.t >= today) upcoming.push(d);
    else if (d.kind === "preorder") openPre.push(d);
    else recent.push(d);
  }
  openPre.reverse(); recent.reverse(); lotteries.reverse();
  const section = (name, arr, empty) => `<h2>${name} (${arr.length})</h2>` +
    (arr.length ? arr.map(d => row(d, now)).join("") : `<div class="empty">${empty}</div>`);
  document.getElementById("list").innerHTML =
    section("Lotteries &amp; raffles — check the entry window", lotteries, "No open lotteries spotted in the last 3 weeks.") +
    section("Upcoming", upcoming, "Nothing scheduled.") +
    section("Pre-orders opened recently", openPre, "No new shop pre-orders in the last 3 weeks.") +
    section("Recent news &amp; releases", recent, "Nothing recent.");
}

fetch("drops.json", { cache: "no-store" }).then(r => r.json()).then(j => {
  data = j;
  const games = ["All", ...[...new Set(j.drops.map(d => d.game))].sort()];
  document.getElementById("chips").innerHTML = games.map(g =>
    `<button class="chip" aria-pressed="${g === filter}" data-g="${esc(g)}">${esc(g)}</button>`).join("");
  document.getElementById("chips").onclick = e => {
    const g = e.target.dataset?.g; if (!g) return;
    filter = g;
    document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c.dataset.g === g));
    render();
  };
  const upd = new Date(j.generated).toLocaleString("en-US", { timeZone: TZ, month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
  document.getElementById("meta").innerHTML =
    `Updated ${esc(upd)} Chicago · <a href="drops.ics">subscribe to calendar</a>` +
    (j.errors?.length ? ` · <span class="err" title="${esc(j.errors.join("\n"))}">${j.errors.length} source(s) failed last run</span>` : "");
  render();
}).catch(() => { document.getElementById("meta").textContent = "Couldn't load drops.json yet. The first scheduled run creates it."; });
</script>
</body>
</html>
